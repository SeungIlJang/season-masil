<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="description" content="서울·경기의 사계절 공공시설과 행사를 한곳에서 찾는 모두의 시즌마실" />
    <title>모두의 시즌마실</title>
    <style>
      .boot-loading{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#f5f2e9;color:#203329;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;text-align:center}
      .boot-loading__mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 18px;border-radius:50%;background:#203329;color:#f5f2e9;font:700 24px/1 serif}
      .boot-loading strong{display:block;font-size:20px}.boot-loading p{margin:10px 0 0;color:#657268;font-size:14px}
      .boot-loading__spinner{width:34px;height:34px;margin:24px auto 0;border:3px solid rgba(32,51,41,.18);border-top-color:#e76e50;border-radius:50%;animation:boot-spin .8s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status" aria-live="polite">
        <div>
          <span class="boot-loading__mark" aria-hidden="true">모</span>
          <strong>모두의 시즌마실</strong>
          <p>앱을 준비하고 있어요.</p>
          <div class="boot-loading__spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
